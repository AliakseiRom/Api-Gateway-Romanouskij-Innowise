server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1

jwt:
  secret: ${JWT_SECRET}