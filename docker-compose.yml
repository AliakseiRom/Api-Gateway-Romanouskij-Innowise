version: '3.9'

services:

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}"

  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${AUTH_DB_NAME}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ../auth-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${USER_DB_NAME}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
      - ../user-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${ORDER_DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT}"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
      - ../order-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:17
    container_name: payment-db
    ports:
      - "${PAYMENT_DB_PORT}"
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ../payment-service/db/init:/docker-entrypoint-initdb.d

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "${KAFKA_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  user-service:
    build: ../user-service
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${USER_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      DB_URL: ${USER_POSTGRES_DB_URL}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  auth-service:
    build: ../auth-service
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      user-service:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "${AUTH_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

      DB_URL: ${AUTH_POSTGRES_DB_URL}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_SERVICES_USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  order-service:
    build: ../order-service
    container_name: order-service
    depends_on:
      kafka:
        condition: service_started
      order-db:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "${ORDER_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082

      DB_URL: ${ORDER_POSTGRES_DB_URL}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}

      USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_POSTGRES}

  payment-service:
    build: ../payment-service
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8086

      DB_URL: ${PAYMENT_POSTGRES_DB_URL}
      DB_USERNAME: ${PAYMENT_DB_USERNAME}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_POSTGRES}
      RANDOM_NUMBER_SERVICE_URL: ${RANDOM_NUMBER_SERVICE_URL}
    depends_on:
      - payment-db
      - kafka

  api-gateway:
    build: .
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL_DOCKER}
      USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL_DOCKER}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL_DOCKER}

      JWT_SECRET: ${JWT_SECRET}

volumes:
  auth_postgres_data:
  user_postgres_data:
  order_postgres_data:
  payment_postgres_data: