version: '3.9'

services:

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"

  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${AUTH_DB_NAME}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ../auth-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${USER_DB_NAME}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
      - ../user-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      DB_NAME: ${ORDER_DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
      - ../order-service/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ../user-service
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      DB_URL: ${USER_POSTGRES_DB_URL}
      DB_USERNAME: ${USER_DB_USERNAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  auth-service:
    build: ../auth-service
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      user-service:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080

      DB_URL: ${AUTH_POSTGRES_DB_URL}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_SERVICES_USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  order-service:
    build: ../order-service
    container_name: order-service
    depends_on:
      order-db:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "${ORDER_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082

      DB_URL: ${ORDER_POSTGRES_DB_URL}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}

      USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}

  api-gateway:
    build: .
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL_DOCKER}
      USER_SERVICE_URL: ${USER_SERVICE_URL_DOCKER}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL_DOCKER}

      JWT_SECRET: ${JWT_SECRET}

volumes:
  auth_postgres_data:
  user_postgres_data:
  order_postgres_data: